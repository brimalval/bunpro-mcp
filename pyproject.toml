[project]
name = "bunpro-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "mcp[cli]>=1.26.0",
    "pydantic>=2.12.5",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.5",
]

[tool.coverage.run]
omit = ["src/types/*"]

[tool.ruff]
exclude = [
    "skills",
    ".sisyphus",
    ".claude",
    ".agents",
    ".venv",
    "__pycache__",
]
